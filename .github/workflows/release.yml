name: release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm run ci
      - run: npm pack
